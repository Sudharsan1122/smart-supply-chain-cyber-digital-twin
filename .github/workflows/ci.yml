name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: supply_chain_twin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Mosquitto
        run: |
          docker cp config/mosquitto.conf $(docker ps -q --filter ancestor=eclipse-mosquitto:2):/mosquitto/config/mosquitto.conf
          docker restart $(docker ps -q --filter ancestor=eclipse-mosquitto:2)
          sleep 2

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pyyaml

      - name: Initialize Database Schema and Seeds
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -p 5432 -U postgres -d supply_chain_twin -f database/schema.sql
          psql -h localhost -p 5432 -U postgres -d supply_chain_twin -f database/seed.sql
          psql -h localhost -p 5432 -U postgres -d supply_chain_twin -f database/seed_attacks.sql

      - name: Verify Seeded Assets
        env:
          PGPASSWORD: postgres
        run: |
          COUNT=$(psql -h localhost -p 5432 -U postgres -d supply_chain_twin -t -A -c "SELECT COUNT(*) FROM assets;")
          echo "Asset count: $COUNT"
          if [ "$COUNT" -ne 32 ]; then
            echo "Error: Expected 32 seeded assets, got $COUNT"
            exit 1
          fi

      - name: Verify Python Imports
        run: |
          python -c "import api.app; print('api.app: OK')"
          python -c "import dashboard.app; print('dashboard.app: OK')"
          python -c "import digital_twin.graph; print('digital_twin.graph: OK')"
          python -c "import detection.engine; print('detection.engine: OK')"

      - name: Run Test Suite
        run: |
          pytest tests/

      - name: Start Uvicorn and Verify Ready Endpoint
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: supply_chain_twin
          DB_USER: postgres
          DB_PASSWORD: postgres
          MQTT_BROKER_HOST: localhost
          MQTT_BROKER_PORT: 1883
          PYTHONUNBUFFERED: "1"
        run: |
          python -m uvicorn api.app:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/api/health
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/api/ready

      - name: Build API Docker Image
        run: |
          docker build -t sscdt-api:ci .
