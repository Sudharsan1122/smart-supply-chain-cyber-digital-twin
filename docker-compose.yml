services:
  postgres:
    image: postgres:16-alpine
    container_name: sscdt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: supply_chain_twin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./database/seed_attacks.sql:/docker-entrypoint-initdb.d/03_seed_attacks.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sscdt-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sscdt-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sscdt-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sscdt-api:latest
    container_name: sscdt-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: supply_chain_twin
      DB_USER: postgres
      DB_PASSWORD: postgres
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      DITTO_URL: http://ditto-nginx/api/2
      ENVIRONMENT: PRODUCTION
    ports:
      - "8000:8000"
    volumes:
      - ml_artifacts:/app/ml/artifacts
      - suricata_logs:/var/log/suricata
    networks:
      - sscdt-net

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: sscdt-dashboard:latest
    container_name: sscdt-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
      DASHBOARD_PORT: 5000
      DASHBOARD_REFRESH_SECONDS: 5
    ports:
      - "5000:5000"
    networks:
      - sscdt-net

  # ===== Eclipse Ditto Digital Twin Framework =====
  ditto-mongodb:
    image: mongo:6
    container_name: sscdt-ditto-mongodb
    restart: unless-stopped
    command: mongod --storageEngine wiredTiger --noscripting
    volumes:
      - ditto_mongo_data:/data/db
    networks:
      sscdt-net:
        aliases:
          - mongodb

  ditto-policies:
    image: docker.io/eclipse/ditto-policies:latest
    container_name: sscdt-ditto-policies
    restart: unless-stopped
    environment:
      - BIND_HOSTNAME=0.0.0.0
      - INSTANCE_INDEX=1
      - MONGO_DB_HOSTNAME=ditto-mongodb
      - DITTO_MONGO_URI=mongodb://ditto-mongodb:27017/policies
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:+UseStringDeduplication -Xss512k -XX:MaxRAMPercentage=50 -XX:+UseG1GC -XX:MaxGCPauseMillis=150 -Dpekko.coordinated-shutdown.exit-jvm=on -Dpekko.cluster.shutdown-after-unsuccessful-join-seed-nodes=180s -Dpekko.cluster.failure-detector.threshold=15.0 -Dpekko.cluster.failure-detector.expected-response-after=10s -Dpekko.cluster.failure-detector.acceptable-heartbeat-pause=20s -Dpekko.cluster.downing-provider-class=
    depends_on:
      - ditto-mongodb
    networks:
      sscdt-net:
        aliases:
          - ditto-cluster

  ditto-things:
    image: docker.io/eclipse/ditto-things:latest
    container_name: sscdt-ditto-things
    restart: unless-stopped
    environment:
      - BIND_HOSTNAME=0.0.0.0
      - INSTANCE_INDEX=1
      - MONGO_DB_HOSTNAME=ditto-mongodb
      - DITTO_MONGO_URI=mongodb://ditto-mongodb:27017/things
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:+UseStringDeduplication -Xss512k -XX:MaxRAMPercentage=50 -XX:+UseG1GC -XX:MaxGCPauseMillis=150 -Dpekko.coordinated-shutdown.exit-jvm=on -Dpekko.cluster.shutdown-after-unsuccessful-join-seed-nodes=180s -Dpekko.cluster.failure-detector.threshold=15.0 -Dpekko.cluster.failure-detector.expected-response-after=10s -Dpekko.cluster.failure-detector.acceptable-heartbeat-pause=20s -Dpekko.cluster.downing-provider-class=
    depends_on:
      - ditto-mongodb
      - ditto-policies
    networks:
      sscdt-net:
        aliases:
          - ditto-cluster

  ditto-things-search:
    image: docker.io/eclipse/ditto-things-search:latest
    container_name: sscdt-ditto-things-search
    restart: unless-stopped
    environment:
      - BIND_HOSTNAME=0.0.0.0
      - INSTANCE_INDEX=1
      - MONGO_DB_HOSTNAME=ditto-mongodb
      - DITTO_MONGO_URI=mongodb://ditto-mongodb:27017/things-search
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:+UseStringDeduplication -Xss512k -XX:MaxRAMPercentage=50 -XX:+UseG1GC -XX:MaxGCPauseMillis=150 -Dpekko.coordinated-shutdown.exit-jvm=on -Dpekko.cluster.shutdown-after-unsuccessful-join-seed-nodes=180s -Dpekko.cluster.failure-detector.threshold=15.0 -Dpekko.cluster.failure-detector.expected-response-after=10s -Dpekko.cluster.failure-detector.acceptable-heartbeat-pause=20s -Dpekko.cluster.downing-provider-class=
    depends_on:
      - ditto-mongodb
      - ditto-policies
    networks:
      sscdt-net:
        aliases:
          - ditto-cluster

  ditto-gateway:
    image: docker.io/eclipse/ditto-gateway:latest
    container_name: sscdt-ditto-gateway
    restart: unless-stopped
    environment:
      - BIND_HOSTNAME=0.0.0.0
      - INSTANCE_INDEX=1
      - ENABLE_PRE_AUTHENTICATION=true
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:+UseStringDeduplication -Xss512k -XX:MaxRAMPercentage=50 -XX:+UseG1GC -XX:MaxGCPauseMillis=150 -Dpekko.coordinated-shutdown.exit-jvm=on -Dpekko.cluster.shutdown-after-unsuccessful-join-seed-nodes=180s -Dpekko.cluster.failure-detector.threshold=15.0 -Dpekko.cluster.failure-detector.expected-response-after=10s -Dpekko.cluster.failure-detector.acceptable-heartbeat-pause=20s -Dpekko.cluster.downing-provider-class=
    depends_on:
      - ditto-policies
      - ditto-things
      - ditto-things-search
    networks:
      sscdt-net:
        aliases:
          - ditto-cluster

  ditto-nginx:
    image: nginx:1.27-alpine
    container_name: sscdt-ditto-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./config/ditto/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ditto/index.html:/etc/nginx/html/index.html:ro
    depends_on:
      - ditto-gateway
    networks:
      - sscdt-net

  # ===== Wazuh SIEM + Suricata IDS =====
  wazuh:
    image: wazuh/wazuh-manager:4.7.0
    container_name: sscdt-wazuh
    user: root
    restart: unless-stopped
    command: python /app/wazuh_services.py
    ports:
      - "1514:1514/udp"
      - "55000:55000"
    volumes:
      - wazuh_data:/var/ossec/data
      - ./config/wazuh/wazuh_services.py:/app/wazuh_services.py:ro
    environment:
      - INDEXER_URL=http://wazuh-indexer:9200
      - WAZUH_ROLE=manager
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:55000"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sscdt-net

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.0
    container_name: sscdt-wazuh-indexer
    user: root
    restart: unless-stopped
    command: python /app/wazuh_services.py
    volumes:
      - ./config/wazuh/wazuh_services.py:/app/wazuh_services.py:ro
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - WAZUH_ROLE=indexer
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sscdt-net

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.0
    container_name: sscdt-wazuh-dashboard
    user: root
    restart: unless-stopped
    command: python /app/wazuh_services.py
    ports:
      - "8443:5601"
    volumes:
      - ./config/wazuh/wazuh_services.py:/app/wazuh_services.py:ro
    environment:
      - WAZUH_ROLE=dashboard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sscdt-net

  suricata:
    image: jasonish/suricata:latest
    container_name: sscdt-suricata
    user: root
    restart: unless-stopped
    command: python /app/wazuh_services.py
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - NET_RAW
    volumes:
      - suricata_logs:/var/log/suricata
      - ./config/wazuh/wazuh_services.py:/app/wazuh_services.py:ro
    environment:
      - WAZUH_ROLE=suricata
    healthcheck:
      test: ["CMD", "test", "-f", "/var/log/suricata/eve.json"]
      interval: 15s
      timeout: 5s
      retries: 3

  sonarqube:
    image: sonarqube:community
    container_name: sscdt-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
    depends_on:
      - sonarqube-db

  sonarqube-db:
    image: postgres:16-alpine
    container_name: sscdt-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data

networks:
  sscdt-net:
    name: sscdt-network

volumes:
  pgdata:
  ml_artifacts:
  ditto_mongo_data:
  wazuh_data:
  suricata_logs:
  sonarqube_data:
  sonarqube_db:

