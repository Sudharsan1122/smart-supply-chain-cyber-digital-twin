services:
  postgres:
    image: postgres:16-alpine
    container_name: sscdt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: supply_chain_twin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./database/seed_attacks.sql:/docker-entrypoint-initdb.d/03_seed_attacks.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sscdt-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sscdt-api:latest
    container_name: sscdt-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: supply_chain_twin
      DB_USER: postgres
      DB_PASSWORD: postgres
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      ENVIRONMENT: PRODUCTION
    ports:
      - "8000:8000"
    volumes:
      - ml_artifacts:/app/ml/artifacts

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: sscdt-dashboard:latest
    container_name: sscdt-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      DASHBOARD_PORT: 5000
      DASHBOARD_REFRESH_SECONDS: 5
    ports:
      - "5000:5000"

volumes:
  pgdata:
  ml_artifacts:
