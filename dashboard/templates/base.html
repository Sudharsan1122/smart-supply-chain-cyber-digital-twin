<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Supply Chain Cyber Digital Twin</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/live_map.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="logo">⚡</span>
        <span class="title">Smart Supply Chain Cyber Digital Twin</span>
    </div>
    <nav class="tabs">
        <a href="/" class="{% if active == 'live' %}active{% endif %}" data-tab="live">Live Fleet</a>
        <a href="/stories" class="{% if active == 'stories' %}active{% endif %}" data-tab="stories">Attack Stories</a>
        <a href="/threat-intel" class="{% if active == 'threat-intel' %}active{% endif %}" data-tab="threat-intel">Threat Intel</a>
        <a href="/triage" class="{% if active == 'triage' %}active{% endif %}" data-tab="triage">Triage</a>
    </nav>
    <div class="status">
        <a href="http://localhost:8080" target="_blank" id="ditto-badge" class="ditto-badge {% if ditto_status and ditto_status.ditto_reachable %}connected{% endif %}" title="Open Eclipse Ditto Digital Twin Explorer (http://localhost:8080)">
            <span class="dot"></span> Powered by Eclipse Ditto
        </a>
        <span class="live-badge" id="live-badge"><span class="dot"></span>LIVE (3s)</span>
        <button id="download-report" class="btn-primary" title="Download current dashboard state as JSON">Download Report</button>
    </div>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="footer">
    <span>Backend API: <code>{{ api_url }}</code> &bull; <a href="http://localhost:8080" target="_blank" style="color:#58a6ff; text-decoration:none;">Eclipse Ditto Digital Twin API (<code>http://localhost:8080/api/2/things</code>)</a></span>
</footer>

<script>
    window.DASHBOARD = {
        activeTab: "{{ active }}",
        refreshSeconds: {{ refresh }},
        apiUrl: "{{ api_url }}"
    };
</script>
<script src="{{ url_for('static', filename='js/live_charts.js') }}"></script>
<script src="{{ url_for('static', filename='js/live_topology.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
